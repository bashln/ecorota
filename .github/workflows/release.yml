name: Release

on:
  push:
    tags:
      - "v*.*.*"

# The release job writes the GitHub release and its assets.
permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build signed release
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
      RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
      RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
      RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Require signing secrets
        run: |
          missing=0
          for name in RELEASE_KEYSTORE_BASE64 RELEASE_KEYSTORE_PASSWORD RELEASE_KEY_ALIAS RELEASE_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error title=Release signing not configured::$name is not set in the repository secrets."
              missing=1
            fi
          done
          exit "$missing"

      - name: Install Android platform and build tools
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          "$SDKMANAGER" --install "platforms;android-36" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Derive version from tag
        id: version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error title=Invalid release tag::$tag is not vMAJOR.MINOR.PATCH"
            exit 1
          fi
          IFS=. read -r major minor patch <<< "$version"
          if (( minor > 99 || patch > 99 )); then
            echo "::error title=Version not representable::MINOR and PATCH must be 0..99 for the versionCode scheme."
            exit 1
          fi
          code=$((10#$major * 10000 + 10#$minor * 100 + 10#$patch))
          if (( code < 1 )); then
            echo "::error title=Invalid version::versionCode must be at least 1."
            exit 1
          fi
          echo "name=$version" >> "$GITHUB_OUTPUT"
          echo "code=$code" >> "$GITHUB_OUTPUT"
          echo "Building EcoRota $version (versionCode $code)"

      - name: Materialize upload keystore
        run: |
          umask 077
          keystore_path="$RUNNER_TEMP/ecorota-release.keystore"
          printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          test -s "$keystore_path"
          echo "RELEASE_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Test, lint and build signed artifacts
        run: >
          ./gradlew
          :core:domain:test
          :app:testPlayDebugUnitTest
          :app:testLibreDebugUnitTest
          :app:lintPlayDebug
          :app:lintLibreDebug
          :app:bundlePlayRelease
          :app:assemblePlayRelease
          :app:assembleLibreRelease
          -PappVersionName="${{ steps.version.outputs.name }}"
          -PappVersionCode="${{ steps.version.outputs.code }}"
          --console=plain
          --stacktrace

      - name: Verify artifact signatures
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -n 1)
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/play/release/app-play-release.apk
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/libre/release/app-libre-release.apk
          jarsigner -verify app/build/outputs/bundle/playRelease/app-play-release.aab | grep -q "jar verified"

      - name: Collect release assets
        run: |
          version="${{ steps.version.outputs.name }}"
          mkdir -p release-assets
          cp app/build/outputs/bundle/playRelease/app-play-release.aab "release-assets/ecorota-play-${version}.aab"
          cp app/build/outputs/apk/play/release/app-play-release.apk "release-assets/ecorota-play-${version}.apk"
          cp app/build/outputs/apk/libre/release/app-libre-release.apk "release-assets/ecorota-libre-${version}.apk"
          if [ -f app/build/outputs/mapping/playRelease/mapping.txt ]; then
            cp app/build/outputs/mapping/playRelease/mapping.txt "release-assets/ecorota-play-${version}-mapping.txt"
          fi
          if [ -f app/build/outputs/mapping/libreRelease/mapping.txt ]; then
            cp app/build/outputs/mapping/libreRelease/mapping.txt "release-assets/ecorota-libre-${version}-mapping.txt"
          fi
          (cd release-assets && sha256sum ./* > SHA256SUMS.txt)
          ls -lh release-assets

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: ecorota-${{ steps.version.outputs.name }}
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION_NAME: ${{ steps.version.outputs.name }}
        run: |
          set -euo pipefail
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" release-assets/* --clobber
          else
            gh release create "$GITHUB_REF_NAME" release-assets/* \
              --title "EcoRota ${VERSION_NAME}" \
              --generate-notes \
              --verify-tag
          fi
